name: Browser E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/browser-e2e.yml"
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "e2e/**"

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - name: Build frontend
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm --prefix frontend run build
      - name: Install browser runner
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run browser smoke
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory frontend/dist >/tmp/frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          python e2e/browser_smoke.py
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 14
