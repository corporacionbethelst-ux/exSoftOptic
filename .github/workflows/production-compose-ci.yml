name: Production Compose CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.production.yml"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - ".github/workflows/production-compose-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.production.yml"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPTICA_POSTGRES_USER: optica
      OPTICA_POSTGRES_PASSWORD: ci-postgres-password
      OPTICA_POSTGRES_DB: optica
      OPTICA_MONGO_USER: optica
      OPTICA_MONGO_PASSWORD: ci-mongo-password
      OPTICA_MONGO_DB: optica
      REDIS_PASSWORD: ci-redis-password
      SECRET_KEY: ci-secret-key-with-more-than-thirty-two-characters
      METRICS_TOKEN: ci-metrics-token-with-more-than-thirty-two-characters
      CORS_ORIGINS: '["https://app.example.com"]'
      CFDI_PROVIDER: HTTP
      CFDI_API_URL: https://cfdi.example.com
      CFDI_API_KEY: ci-cfdi-key
      BANKING_PROVIDER: HTTP
      BANKING_API_URL: https://bank.example.com
      BANKING_API_KEY: ci-bank-key
    steps:
      - uses: actions/checkout@v4
      - name: Render production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build production application images
        run: docker compose -f docker-compose.production.yml build backend frontend
